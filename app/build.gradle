plugins {
    id "com.android.application"
}
android {
    namespace "com.mjueyesu.app"
    compileSdk 34
    defaultConfig {
        applicationId "com.mjueyesu.app"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "4.0.7"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
    signingConfigs {
        debug {
            storeFile file("mjue-debug.keystore")
            storePassword "android"
            keyAlias "mjue"
            keyPassword "android"
        }
        // Funguo ya kuchapisha (siri): inatoka kwenye GitHub Secrets, haiko ndani ya repo.
        release {
            def ks = file("release.jks")
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (file("release.jks").exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}
dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "com.google.mlkit:text-recognition:16.0.0"
}
